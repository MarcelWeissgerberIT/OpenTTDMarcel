<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTTD Marcel</title>
<style>
	:root { --panel:#6d8a37; --panel-dark:#4a6126; --btn:#f5a623; --btn-border:#8a5a00; --text:#1c1c1c; }
	* { box-sizing:border-box; margin:0; padding:0; }
	body { min-height:100vh; display:flex; align-items:center; justify-content:center;
		background:#3f5d2a url('') repeat; font-family:Verdana, Geneva, sans-serif; color:var(--text);
		image-rendering:pixelated; }
	.panel { background:var(--panel); border:4px solid var(--panel-dark); border-radius:4px;
		box-shadow:0 8px 0 rgba(0,0,0,.35); padding:28px 32px; max-width:520px; width:92%; text-align:center; }
	h1 { color:#fff; text-shadow:2px 2px 0 #2c3a18; font-size:1.6rem; margin-bottom:12px; letter-spacing:1px; }
	p { color:#eef3e2; margin-bottom:20px; line-height:1.5; }
	.btn { display:inline-block; background:var(--btn); border:3px solid var(--btn-border);
		border-radius:3px; padding:12px 22px; font-weight:bold; color:var(--text);
		text-decoration:none; box-shadow:0 4px 0 var(--btn-border); }
	.btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--btn-border); }
	.hint { margin-top:18px; font-size:.8rem; color:#d7e0c2; }
</style>
</head>
<body>
	<div class="panel">
		<h1>OpenTTD Marcel</h1>
		<p>Die Eisenbahn-Wirtschaftssimulation im Browser &mdash; mit Candyland-Welt,
		Auto-Verbindung und deutscher Oberfl&auml;che.</p>
		<a class="btn" href="https://marcelweissgerberit.github.io/OpenTTDMarcel/">Jetzt gratis spielen</a>
		<p class="hint" style="margin-top:18px"><a href="login.html" style="color:#ffe9b0">Anmelden</a> &middot; <a href="register.html" style="color:#ffe9b0">Konto erstellen</a></p>
		<p class="hint">Cloud-Spielst&auml;nde und Premium-Features sind in Arbeit.</p>
	</div>
</body>
</html>
