<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t-title="reg_page">Registrieren – OpenTTD Marcel</title>
<link rel="stylesheet" href="style.css">
<script src="lang.js"></script>
</head>
<body>
<div class="panel">
	<h1 data-t="reg_title"></h1>
	<form id="f">
		<label for="email" data-t="email"></label>
		<input id="email" type="email" required autocomplete="email">
		<label for="pw" data-t="pw_min"></label>
		<input id="pw" type="password" minlength="8" required autocomplete="new-password">
		<button class="btn" type="submit" data-t="reg_submit"></button>
	</form>
	<div class="msg" id="msg"></div>
	<div class="links"><span data-t="reg_haveaccount"></span> <a href="login.html" data-t="reg_tologin"></a> &middot; <a href="index.html" data-t="back"></a> &middot; <span id="langswitch"></span></div>
</div>
<script>
const API = 'https://openttd-api.marcelweissgerber81.workers.dev';
document.getElementById('f').addEventListener('submit', async (e) => {
	e.preventDefault();
	const msg = document.getElementById('msg');
	msg.textContent = OTTD_T('reg_working');
	try {
		const r = await fetch(API + '/api/register', {
			method: 'POST', credentials: 'include',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ email: email.value, password: pw.value }),
		});
		const d = await r.json();
		if (d.ok) { if (d.token) localStorage.setItem('ottd_token', d.token); location.href = 'account.html'; } else { msg.textContent = d.message || OTTD_T('err_generic'); }
	} catch { msg.textContent = OTTD_T('err_network'); }
});
</script>
</body>
</html>
