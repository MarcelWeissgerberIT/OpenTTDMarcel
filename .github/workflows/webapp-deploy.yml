name: Webapp Deploy

on:
  push:
    branches: [claude/candyland-scrolling]
    paths: ['webapp/**', '.github/workflows/webapp-deploy.yml']
  workflow_dispatch:

concurrency:
  group: webapp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Ensure D1 database exists
        run: npx wrangler d1 create openttd-web || true

      - name: Inject D1 database id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const db=j.find(x=>x.name==='openttd-web');if(!db){console.error('db not found');process.exit(1)};console.log(db.uuid)})")
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
          grep database_id wrangler.toml

      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket create openttd-saves || true

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply openttd-web --remote

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Stripe-Webhook-Secret setzen (falls vorhanden)
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          else
            echo "Kein STRIPE_WEBHOOK_SECRET in den GitHub-Secrets - Webhook antwortet mit 503."
          fi

      - name: Verify API health
        run: |
          sleep 5
          curl -sS --fail https://openttd-api.marcelweissgerber81.workers.dev/api/health
          echo

      - name: Ensure Pages project exists
        run: npx wrangler pages project create openttd-web --production-branch=main || true

      - name: Deploy site to Pages
        run: npx wrangler pages deploy site --project-name=openttd-web --branch=main --commit-dirty=true

      - name: Verify Pages site
        run: |
          sleep 5
          curl -sS --fail -o /dev/null -w "Pages HTTP %{http_code}\n" https://openttd-web-ene.pages.dev/

      - name: Wait for worker propagation
        run: |
          # Nach dem Deploy laufen kurzzeitig alte und neue Worker-Instanzen
          # parallel; wir warten, bis eine neue Route (401 statt 404)
          # mehrfach hintereinander antwortet.
          API=https://openttd-api.marcelweissgerber81.workers.dev
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/settings")
            if [ "$code" = "401" ]; then
              ok=$((ok + 1))
              [ "$ok" -ge 3 ] && { echo "Neue Worker-Version aktiv."; exit 0; }
            else
              ok=0
              echo "Noch alte Worker-Version (HTTP $code), warte 5s ($i/30)..."
            fi
            sleep 5
          done
          echo "Worker-Version wurde nicht aktuell"; exit 1

      - name: Verify Stripe webhook + admin endpoint
        run: |
          API=https://openttd-api.marcelweissgerber81.workers.dev
          # Nach dem Deploy kann kurz noch die alte Version (404) antworten - mit Wiederholung.
          for i in $(seq 1 12); do
            # Webhook: 503 solange kein Secret gesetzt ist, 400 bei ungueltiger Signatur.
            wh=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "$API/api/stripe/webhook")
            # Admin-Liste ohne Login muss 401 liefern.
            ad=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/admin/purchases")
            if { [ "$wh" = "503" ] || [ "$wh" = "400" ]; } && [ "$ad" = "401" ]; then
              echo "Webhook-Endpunkt OK (HTTP $wh), Admin-Endpunkt OK (HTTP 401 ohne Login)"
              exit 0
            fi
            echo "Noch nicht bereit (Webhook $wh, Admin $ad), warte 5s ($i/12)..."
            sleep 5
          done
          echo "Neue Endpunkte antworten nicht wie erwartet"; exit 1

      - name: Verify world sharing
        run: |
          API=https://openttd-api.marcelweissgerber81.workers.dev
          # Ein Spielstand traegt sein Format im Kopf - der Worker prueft das.
          { printf 'OTTN'; head -c 256 /dev/urandom; } > /tmp/cishare.sav
          ID=$(curl -sS --fail -X POST --data-binary @/tmp/cishare.sav \
            "$API/api/share?name=CI-Welt" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          [ -n "$ID" ] || { echo "Kein Share-Link erhalten"; exit 1; }
          echo "Share-ID: $ID"
          curl -sS --fail "$API/api/share?id=$ID" -o /tmp/cishare-down.sav
          cmp /tmp/cishare.sav /tmp/cishare-down.sav
          # Keine echten Spielstaende: Muell muss abgelehnt werden.
          code=$(head -c 64 /dev/zero | curl -s -o /dev/null -w "%{http_code}" -X POST --data-binary @- "$API/api/share?name=Muell")
          [ "$code" = "400" ] || { echo "Fremdformat wurde nicht abgelehnt (HTTP $code)"; exit 1; }
          echo "Cleanup..."
          npx wrangler r2 object delete "openttd-saves/shares/$ID.sav" --remote > /dev/null 2>&1 || true
          npx wrangler d1 execute openttd-web --remote --command "DELETE FROM shares WHERE id = '$ID'" > /dev/null
          echo "Welt-Teilen OK"

      - name: Verify server list
        run: |
          API=https://openttd-api.marcelweissgerber81.workers.dev
          HOST="ci-test-${GITHUB_RUN_ID}.example.com"
          KEY="ci-$(openssl rand -hex 8)"
          BUILD="citest01"
          echo "Anmelden..."
          curl -sS --fail -X POST "$API/api/servers" -H 'Content-Type: application/json' \
            -d "{\"host\":\"$HOST\",\"name\":\"CI Testserver\",\"key\":\"$KEY\",\"build\":\"$BUILD\"}"
          echo; echo "Steht er in der Liste?"
          curl -sS --fail "$API/api/servers" | grep -q "$HOST"
          echo "Zeigt der Versionsfilter ihn nur bei passender Version?"
          curl -sS --fail "$API/api/servers?build=$BUILD" | grep -q "$HOST"
          if curl -sS --fail "$API/api/servers?build=anders00" | grep -q "$HOST"; then
            echo "Server mit fremder Version wurde nicht ausgeblendet"; exit 1
          fi
          echo "Wird ein fremder Schluessel abgewiesen?"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/api/servers" \
            -H 'Content-Type: application/json' \
            -d "{\"host\":\"$HOST\",\"name\":\"Uebernahme\",\"key\":\"falscher-schluessel\"}")
          [ "$code" = "403" ] || { echo "Fremder Schluessel wurde akzeptiert (HTTP $code)"; exit 1; }
          echo "Abmelden..."
          curl -sS --fail -X DELETE "$API/api/servers" -H 'Content-Type: application/json' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\"}"
          echo; echo "Serverliste OK"

      - name: Verify auth flow end-to-end
        run: |
          API=https://openttd-api.marcelweissgerber81.workers.dev
          EMAIL="citest+${GITHUB_RUN_ID}@example.com"
          PW="ci-test-passwort-123"
          JAR=$(mktemp)
          # Testnutzer auch bei rotem Test wieder aufraeumen.
          trap 'npx wrangler d1 execute openttd-web --remote --command "DELETE FROM users WHERE email = '"'"'$EMAIL'"'"'" > /dev/null 2>&1 || true' EXIT
          echo "Register..."
          curl -sS --fail -c "$JAR" -H 'Content-Type: application/json'             -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}" "$API/api/register"
          echo; echo "Me..."
          curl -sS --fail -b "$JAR" "$API/api/me" | grep -q "$EMAIL"
          echo "Logout..."
          curl -sS --fail -b "$JAR" -X POST "$API/api/logout" > /dev/null
          echo "Login..."
          curl -sS --fail -c "$JAR" -H 'Content-Type: application/json'             -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}" "$API/api/login"
          echo; echo "Me again..."
          curl -sS --fail -b "$JAR" "$API/api/me" | grep -q "$EMAIL"
          echo "Token auth..."
          # Nach dem Worker-Deploy kann die neue Version ein paar Sekunden
          # brauchen, bis sie weltweit aktiv ist - daher mit Wiederholung.
          TOKEN=""
          for i in 1 2 3 4 5 6; do
            TOKEN=$(curl -sS --fail -H 'Content-Type: application/json' \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}" "$API/api/login" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
            [ -n "$TOKEN" ] && break
            echo "  noch alte Worker-Version aktiv, warte 10s (Versuch $i/6)..."
            sleep 10
          done
          [ -n "$TOKEN" ] || { echo "Login-Antwort enthaelt keinen Token"; exit 1; }
          curl -sS --fail -H "Authorization: Bearer $TOKEN" "$API/api/me" | grep -q "$EMAIL"
          echo "Save-Sync (Upload/Liste/Download/Delete)..."
          head -c 2048 /dev/urandom > /tmp/citest.sav
          curl -sS --fail -X PUT -H "Authorization: Bearer $TOKEN" --data-binary @/tmp/citest.sav "$API/api/saves/upload?name=citest.sav"
          echo
          curl -sS --fail -H "Authorization: Bearer $TOKEN" "$API/api/saves" | grep -q "citest.sav"
          curl -sS --fail -H "Authorization: Bearer $TOKEN" "$API/api/saves/download?slot=1" -o /tmp/citest-down.sav
          cmp /tmp/citest.sav /tmp/citest-down.sav
          curl -sS --fail -X DELETE -H "Authorization: Bearer $TOKEN" "$API/api/saves/delete?slot=1" > /dev/null
          echo "Settings-Sync..."
          curl -sS --fail -X PUT -H "Authorization: Bearer $TOKEN" --data "language = de_DE" "$API/api/settings" > /dev/null
          curl -sS --fail -H "Authorization: Bearer $TOKEN" "$API/api/settings" | grep -q "de_DE"
          echo "Cleanup test user..."
          npx wrangler d1 execute openttd-web --remote --command "DELETE FROM users WHERE email = '$EMAIL'"
          echo "Auth flow OK"
