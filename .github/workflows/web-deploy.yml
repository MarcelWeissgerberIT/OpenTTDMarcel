name: Web-Build und Deploy (WASM zu GitHub Pages)

# Baut die Browser-Version (Emscripten/WASM) aus diesem Branch und
# veröffentlicht sie direkt auf GitHub Pages. Die Basisgrafiken
# (OpenGFX-Detail + Candyland) liegen unter web/baseset/ im Repo.

on:
  push:
    branches: [claude/candyland-scrolling]
    paths-ignore: ['webapp/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: emsdk-Image bauen (gepinnte Version aus os/emscripten)
        run: docker build -t emsdk-openttd os/emscripten

      - name: Host-Tools bauen
        run: |
          mkdir build-host
          docker run --rm -v "$(pwd):$(pwd)" -u "$(id -u):$(id -g)" --workdir "$(pwd)/build-host" emsdk-openttd cmake .. -DOPTION_TOOLS_ONLY=ON
          docker run --rm -v "$(pwd):$(pwd)" -u "$(id -u):$(id -g)" --workdir "$(pwd)/build-host" emsdk-openttd make -j"$(nproc)" tools

      - name: WASM bauen (inkl. gebündelter Basisgrafiken)
        run: |
          mkdir -p build/baseset
          cp web/baseset/* build/baseset/
          docker run --rm -v "$(pwd):$(pwd)" -u "$(id -u):$(id -g)" --workdir "$(pwd)/build" emsdk-openttd emcmake cmake .. -DHOST_BINARY_DIR=../build-host -DCMAKE_BUILD_TYPE=Release -DOPTION_USE_ASSERTS=OFF
          docker run --rm -v "$(pwd):$(pwd)" -u "$(id -u):$(id -g)" --workdir "$(pwd)/build" emsdk-openttd emmake make -j"$(nproc)"

      - name: Seite zusammenstellen
        run: |
          mkdir site
          cp build/openttd.html site/index.html
          cp build/openttd.html build/openttd.js build/openttd.wasm build/openttd.data site/
          touch site/.nojekyll

      - name: Auf gh-pages veröffentlichen (Branch-Deployment übernimmt)
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Web-Build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
