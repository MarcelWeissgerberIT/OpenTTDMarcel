      div.overlay {
        height: 40px;
        margin: 0 auto;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        text-align: center;
        transition: opacity 0.3s;
        width: 100%;
        z-index: 3;
      }
      div.overlay > div {
        pointer-events: none;
      }

      div.background > div, div.overlay > div {
        margin: auto;
      }

      #filesystem {
        background-color: #e00000;
        border: 1px solid #fc6458;
        color: #fcf880;
        display: none;
        outline: #a00000;
        padding: 0 4px;
        width: 600px;
      }

      #title, #message {
        background-color: #838383;
        border: 1px solid #a8a8a8;
        outline: 1px solid #626262;
        padding: 0 4px;
        min-width: 260px;
      }

      #box.error #title, #box.error #message {
        background-color: #e00000;
        border: 1px solid #fc6458;
        outline: #a00000;
      }
      #box.error #message {
        color: #fcf880;
      }

      #title {
        color: #fcfcfc;
        height: 20px;
        text-shadow: 1px 1px #101010;
      }
      #message {
        color: #101010;
        padding: 4px 4px;
      }

      canvas.emscripten {
        border: 0px none;
        height: 100%;
        position: absolute;
        width: 100%;
        z-index: 2;
        /* OpenTTD draws the cursor itself */
        cursor: none !important;
      }

      /* Cloud-Sync-Panel (Phase 4) im Spiel-UI-Grau */
      #cloud {
        bottom: 8px;
        position: absolute;
        right: 8px;
        z-index: 4;
      }
      #cloud-badge {
        display: none;
        background-color: #838383;
        border: 1px solid #a8a8a8;
        color: #fcfcfc;
        cursor: pointer;
        outline: 1px solid #626262;
        padding: 3px 8px;
        text-shadow: 1px 1px #101010;
        user-select: none;
      }
      #cloud-panel {
        background-color: #838383;
        border: 1px solid #a8a8a8;
        bottom: 40vh;
        color: #101010;
        display: none;
        outline: 1px solid #626262;
        padding: 8px;
        position: fixed;
        right: calc(50vw - 130px);
        width: 250px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.45);
      }
      #cloud-panel input {
        box-sizing: border-box;
        margin: 2px 0;
        width: 100%;
      }
      #cloud-panel button {
        background-color: #c16d33;
        border: 1px solid #e6963f;
        color: #fcfcfc;
        cursor: pointer;
        margin-top: 4px;
        padding: 2px 8px;
        text-shadow: 1px 1px #6d3300;
        width: 100%;
      }
      /* Werbe-Fahne: faellt auf, ohne beim Spielen im Weg zu sein.
         Wer gekauft hat, sieht sie nie - siehe updateBuyBadge(). */
      #buy-badge {
        background: #f8b400;
        border: 2px solid #a06a00;
        border-radius: 4px;
        color: #3a2200;
        cursor: pointer;
        display: none;
        font: bold 13px/1.5 sans-serif;
        padding: 3px 10px;
        /* Unten rechts ueber dem Cloud-Knopf: dort ist im Spiel Platz,
         * oben liegt die Werkzeugleiste. */
        bottom: 36px;
        position: fixed;
        right: 8px;
        text-decoration: none;
        z-index: 12;
      }
      #buy-badge:hover { background: #ffd257; }
      #buy-box {
        background: #fff6e0;
        border: 2px solid #a06a00;
        border-radius: 4px;
        color: #3a2200;
        font: 13px/1.6 sans-serif;
        margin-top: 10px;
        padding: 8px 10px;
        text-align: left;
      }
      #buy-box b { display: block; margin-bottom: 4px; }
      #buy-box ul { margin: 4px 0 8px 18px; padding: 0; }
      #buy-box a.buy {
        background: #f8b400;
        border: 2px solid #a06a00;
        border-radius: 3px;
        color: #3a2200;
        display: inline-block;
        font-weight: bold;
        padding: 4px 12px;
        text-decoration: none;
      }
      #cloud-status {
        color: #2b2b2b;
        font-size: 12px;
        margin-top: 4px;
        min-height: 14px;
      }
    </style>

  <body>
    <div class="background">
      <div id="box">
        <div id="title">
          Loading ...
        </div>
        <div id="message">
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div id="filesystem">
        Warning: savegames are stored in the Indexed DB of your browser.<br/>Your browser can delete savegames without notice!
      </div>
    </div>
    <div>
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <div id="cloud">
      <div id="cloud-panel">
        <div id="buy-box">
          <b id="buy-title"></b>
          <ul id="buy-list"></ul>
          <a class="buy" id="buy-cta" href="https://marcelweissgerberit.github.io/OpenTTDMarcel/kaufen/" target="_blank" rel="noopener"></a>
        </div>
        <div id="cloud-form">
          <b id="cloud-title"></b><br/>
          <span id="cloud-sub"></span><br/>
          <input type="email" id="cloud-email" placeholder="E-Mail" autocomplete="email"/>
          <input type="password" id="cloud-pw" placeholder="Passwort" autocomplete="current-password"/>
          <button id="cloud-login"></button>
          <a id="cloud-register" href="https://openttd-web-ene.pages.dev/register.html" target="_blank" rel="noopener"></a>
        </div>
        <div id="cloud-info" style="display:none">
          <b id="cloud-title2"></b><br/>
          <span id="cloud-as"></span> <span id="cloud-user"></span>.<br/>
          <span id="cloud-auto"></span>
          <button id="cloud-logout"></button>
        </div>
        <div id="cloud-status"></div>
        <button id="cloud-close"></button>
      </div>
      <span id="cloud-badge">&#9729; Cloud</span>
      <a id="buy-badge" href="https://marcelweissgerberit.github.io/OpenTTDMarcel/kaufen/" target="_blank" rel="noopener"></a>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');

      var Module = {
        preRun: [],
        postRun: [],
        arguments: [],
        totalDependencies: 42,
        doneDependencies: 0,
        lastDependencies: 1,

        print: function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
        },

        printErr: function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
        },

        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),

        setStatus: function(text) {
          if (document.getElementById("canvas").style.display == "none") return;

          var m = text.match(/^([^(]+)\((\d+(\.\d+)?)\/(\d+)\)$/);

          if (m) {
            text = "(" + m[2] + " / " + m[4] + ") " + m[1];
          }

          document.getElementById("message").innerHTML = text;
        },

        monitorRunDependencies: function(left) {
          /* If it goes up, a new dependency was added; down means one is
           * removed. We only track the latter. */
          if (left < Module.lastDependencies) {
            Module.doneDependencies += 1;
          }
          Module.lastDependencies = left;

          total = Module.totalDependencies;
          doing = Module.doneDependencies + 1;
          if (doing > total) {
            doing = total;
          }

          document.getElementById("title").innerHTML = "(" + doing + " / " + total + ") Loading ...";
          document.getElementById("message").innerHTML = "Preparing game ...";
        },

        onBootstrap: function(current, total) {
          document.getElementById("canvas").style.display = "none";

          document.getElementById("title").innerHTML = "Missing base graphics";
          document.getElementById("message").innerHTML = "OpenTTD is downloading base graphics.<br/><br/>" + current + " / " + total + " bytes downloaded.";
        },

        onBootstrapFailed: function(current, total) {
          document.getElementById("canvas").style.display = "none";

          document.getElementById("title").innerHTML = "Missing base graphics";
          document.getElementById("message").innerHTML = "Failed to download base graphics.<br/>The game cannot start without base graphics.<br/><br/>Please check your Internet connection and/or the console log.<br/>Reload your browser to try again.";
        },

        onBootstrapReload: function() {
          document.getElementById("canvas").style.display = "none";

          document.getElementById("title").innerHTML = "Missing base graphics";
          document.getElementById("message").innerHTML = "Downloading base graphics done.<br/><br/>Your browser will reload to start the game.";
        },

        onExit: function() {
          document.getElementById("canvas").style.display = "none";

          document.getElementById("title").innerHTML = "Thank you for playing!";
          document.getElementById("message").innerHTML = "We hope you enjoyed OpenTTD!<br/><br/>Reload your browser to restart the game.";
        },

        onAbort: function() {
          document.getElementById("canvas").style.display = "none";

          document.getElementById("box").className = "error";
          document.getElementById("title").innerHTML = "Crash :(";
          document.getElementById("message").innerHTML = "The game crashed!<br/><br/>Please reload your browser to restart the game.";
        },

        onWarningFs: function() {
          document.getElementById("filesystem").style.display = "inline-block";
          document.getElementById("overlay").style.opacity = 1;
          setTimeout(function() {
            document.getElementById("overlay").style.opacity = 0;
            setTimeout(function() {
              document.getElementById("filesystem").style.display = "none";
            }, 300);
          }, 10000);
        }
      };

      window.onerror = function() {
        Module.onAbort();
      };

      /* ---------- Cloud-Sync-Panel (Phase 4) ---------- */
      (function() {
        /* Zweisprachig wie das Spiel selbst: OpenTTD folgt der
         * Browsersprache, also darf der Rahmen drumherum nicht auf
         * Deutsch stehenbleiben. */
        var DE = (navigator.language || 'de').toLowerCase().indexOf('de') === 0;
        var T = DE ? {
          buyBadge: '\u2605 Marcel Edition holen',
          buyTitle: '\u2605 Das bekommst du mit der Marcel Edition',
          buyItems: [
            'Spielst\u00e4nde in der Cloud - auf jedem Ger\u00e4t weiterspielen',
            'Pixel-Studio: eigene Fahrzeuge und H\u00e4user malen',
            'Immobilien-Modus: H\u00e4user kaufen, Miete kassieren',
            'Mega-Flughafen und Mega-Bahnhof',
            'Alle k\u00fcnftigen Updates, kein Abo',
          ],
          buyCta: 'Jetzt holen \u2013 39\u00a0\u20ac',
          cloudTitle: 'Cloud-Spielst\u00e4nde',
          cloudSub: 'Mit Konto anmelden, dann werden Spielst\u00e4nde automatisch gesichert.',
          login: 'Anmelden',
          register: 'Konto erstellen',
          as: 'Angemeldet als',
          auto: 'Spielst\u00e4nde werden nach jedem Speichern automatisch gesichert.',
          logout: 'Abmelden',
          close: 'Schlie\u00dfen',
          email: 'E-Mail', pw: 'Passwort',
          needBoth: 'Bitte E-Mail und Passwort eingeben.',
          loggingIn: 'Anmeldung l\u00e4uft...',
          loginFailed: 'Anmeldung fehlgeschlagen.',
        } : {
          buyBadge: '\u2605 Get the Marcel Edition',
          buyTitle: '\u2605 What you get with the Marcel Edition',
          buyItems: [
            'Cloud saves - carry on from any device',
            'Pixel Studio: paint your own vehicles and houses',
            'Real-estate mode: buy houses, collect rent',
            'Mega airport and mega station',
            'All future updates, no subscription',
          ],
          buyCta: 'Get it \u2013 39\u00a0\u20ac',
          cloudTitle: 'Cloud saves',
          cloudSub: 'Sign in with your account and saves are backed up automatically.',
          login: 'Sign in',
          register: 'Create account',
          as: 'Signed in as',
          auto: 'Saves are backed up automatically every time you save.',
          logout: 'Sign out',
          close: 'Close',
          email: 'Email', pw: 'Password',
          needBoth: 'Please enter email and password.',
          loggingIn: 'Signing in...',
          loginFailed: 'Sign-in failed.',
        };

        function applyTexts() {
          function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }
          set('buy-badge', T.buyBadge);
          set('buy-title', T.buyTitle);
          set('buy-cta', T.buyCta);
          var ul = document.getElementById('buy-list');
          if (ul) ul.innerHTML = T.buyItems.map(function(t) {
            var li = document.createElement('li');
            li.textContent = t;
            return li.outerHTML;
          }).join('');
          set('cloud-title', T.cloudTitle);
          set('cloud-title2', T.cloudTitle);
          set('cloud-sub', T.cloudSub);
          set('cloud-login', T.login);
          set('cloud-register', T.register);
          set('cloud-as', T.as);
          set('cloud-auto', T.auto);
          set('cloud-logout', T.logout);
          set('cloud-close', T.close);
          var em = document.getElementById('cloud-email');
          if (em) em.placeholder = T.email;
          var pw = document.getElementById('cloud-pw');
          if (pw) pw.placeholder = T.pw;
        }
        applyTexts();

        var API = 'https://openttd-api.marcelweissgerber81.workers.dev';
        var badge = document.getElementById('cloud-badge');
        var panel = document.getElementById('cloud-panel');
        var statusEl = document.getElementById('cloud-status');

        function token() { try { return localStorage.getItem('ottd_token'); } catch (e) { return null; } }
        function email() { try { return localStorage.getItem('ottd_email'); } catch (e) { return null; } }

        /* Automatische Login-Uebergabe von der Konto-/Startseite (#ottd=TOKEN):
         * Spiel und Webseite haben getrennte Browser-Speicher, daher reicht die
         * Seite den Sitzungs-Schluessel beim Klick auf "Jetzt spielen" weiter.
         * Er wird sofort aus der Adresszeile entfernt. */
        try {
          var handoff = location.hash.match(/[#&]ottd=([\w.~%-]+)/);
          if (handoff) {
            localStorage.setItem('ottd_token', decodeURIComponent(handoff[1]));
            history.replaceState(null, '', location.pathname + location.search);
            fetch(API + '/api/me', { headers: { 'Authorization': 'Bearer ' + decodeURIComponent(handoff[1]) } })
              .then(function(r) { return r.json(); })
              .then(function(d) {
                if (d && d.email) { try { localStorage.setItem('ottd_email', d.email); } catch (e) {} }
                render();
              })
              .catch(function() {});
          }
        } catch (e) {}

        /* Hat dieses Konto die Cloud freigeschaltet? Wird vom Server
         * beantwortet - im Browser laesst sich das nicht faelschen, die
         * Speicher-Aufrufe pruefen es dort ohnehin noch einmal. */
        var hasCloud = false;

        function updateBuyBadge() {
          /* Werbung nur fuer alle, die noch nicht gekauft haben. */
          document.getElementById('buy-badge').style.display = hasCloud ? 'none' : 'inline-block';
          document.getElementById('buy-box').style.display = hasCloud ? 'none' : 'block';
        }

        function refreshEntitlements() {
          var t = token();
          if (!t) { hasCloud = false; updateBuyBadge(); return; }
          fetch(API + '/api/me', { headers: { 'Authorization': 'Bearer ' + t } })
            .then(function(r) { return r.json(); })
            .then(function(d) {
              hasCloud = !!(d && d.entitlements && d.entitlements.indexOf('cloud') >= 0);
              updateBuyBadge();
              render();
            })
            .catch(function() { updateBuyBadge(); });
        }

        function render() {
          var loggedIn = !!token();
          /* Angemeldet ohne Kauf: das Anmelde-Formular hilft nicht weiter,
           * der Werbeblock schon. */
          document.getElementById('cloud-form').style.display = loggedIn ? 'none' : 'block';
          document.getElementById('cloud-info').style.display = (loggedIn && hasCloud) ? 'block' : 'none';
          document.getElementById('cloud-user').textContent = email() || '';
          badge.textContent = (loggedIn && hasCloud) ? '⛅ Cloud an' : '☁ Cloud';
          updateBuyBadge();
        }

        /* Vom Spiel-Code aufgerufen, wenn der Server einen Kauf verlangt:
         * Werbe-Fahne hervorheben und das Angebot aufschlagen. */
        window.openttd_show_buy = function() {
          hasCloud = false;
          updateBuyBadge();
          panel.style.display = 'block';
          var b = document.getElementById('buy-badge');
          b.style.transition = 'transform .2s';
          b.style.transform = 'scale(1.25)';
          setTimeout(function() { b.style.transform = 'scale(1)'; }, 400);
        };

        refreshEntitlements();

        Module.onCloudStatus = function(text) {
          statusEl.textContent = text;
          badge.title = text;
        };

        badge.addEventListener('click', function() {
          panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });

        /* Vom Spiel aufgerufen (Knopf "Konto..." im Speichern/Laden-Dialog). */
        window.openttd_cloud_panel = function() {
          render();
          /* Vom Spiel-Code aufgerufen, wenn der Server einen Kauf verlangt:
         * Werbe-Fahne hervorheben und das Angebot aufschlagen. */
        window.openttd_show_buy = function() {
          hasCloud = false;
          updateBuyBadge();
          panel.style.display = 'block';
          var b = document.getElementById('buy-badge');
          b.style.transition = 'transform .2s';
          b.style.transform = 'scale(1.25)';
          setTimeout(function() { b.style.transform = 'scale(1)'; }, 400);
        };

        refreshEntitlements();
          panel.style.display = 'block';
        };
        document.getElementById('cloud-close').addEventListener('click', function() {
          panel.style.display = 'none';
        });

        /* Tastatur im Cloud-Panel nicht ans Spiel durchreichen - sonst
         * loesen E-Mail/Passwort-Eingaben Spiel-Shortcuts aus. */
        var cloudRoot = document.getElementById('cloud');
        ['keydown', 'keyup', 'keypress'].forEach(function(ev) {
          cloudRoot.addEventListener(ev, function(e) { e.stopPropagation(); });
        });
        document.getElementById('cloud-pw').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') document.getElementById('cloud-login').click();
        });

        document.getElementById('cloud-login').addEventListener('click', function() {
          var mail = document.getElementById('cloud-email').value.trim();
          var pw = document.getElementById('cloud-pw').value;
          if (!mail || !pw) { statusEl.textContent = T.needBoth; return; }
          statusEl.textContent = T.loggingIn;
          fetch(API + '/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: mail, password: pw }),
          }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
            .then(function(res) {
              if (!res.ok || !res.d.token) {
                statusEl.textContent = res.d && res.d.message ? res.d.message : T.loginFailed;
                return;
              }
              try {
                localStorage.setItem('ottd_token', res.d.token);
                localStorage.setItem('ottd_email', res.d.email);
              } catch (e) {}
              statusEl.textContent = 'Angemeldet - Seite lädt neu, um Cloud-Spielstände zu holen...';
              setTimeout(function() { location.reload(); }, 800);
            })
            .catch(function() { statusEl.textContent = 'Server nicht erreichbar.'; });
        });

        document.getElementById('cloud-logout').addEventListener('click', function() {
          var t = token();
          if (t) fetch(API + '/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t } }).catch(function() {});
          try {
            localStorage.removeItem('ottd_token');
            localStorage.removeItem('ottd_email');
            localStorage.removeItem('ottd_cloud_pushed');
          } catch (e) {}
          render();
          statusEl.textContent = 'Abgemeldet - Spielstände bleiben lokal erhalten.';
        });

        render();
      })();
    </script>
