[network]
server_name = Marcels Welt
; "local" heisst: nicht im oeffentlichen OpenTTD-Verzeichnis listen.
; Unser Fork passt ohnehin zu keinem fremden Client.
server_game_type = local
max_clients = 12
max_companies = 10
; Firmen ohne Spieler werden nach einer Weile aufgeraeumt, damit die
; Karte nicht mit Karteileichen zuwaechst.
autoclean_companies = true
autoclean_protected = 36
autoclean_unprotected = 12
; Ein Neustart soll die Welt nicht verlieren.
[misc]
autosave = monthly
keep_all_autosave = false
autosave_on_exit = true
